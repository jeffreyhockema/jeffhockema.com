<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeff Hockema</title>
  <meta name="description" content="Jeff Hockema — infrastructure, software, automation." />
  <meta name="theme-color" content="#1b2419" />
  <link rel="icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />

  <style>
    body {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    html { height: 100%; }

    .card {
      z-index: 1;
      width: min(90vw, 520px);
      padding: clamp(2rem, 5vw, 2.9rem) clamp(1.5rem, 5vw, 2.6rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.04em;
      color: #1a1a12;
      background: linear-gradient(145deg, #ffe3a3, var(--accent) 60%, #e8b45a);
      box-shadow:
        0 8px 24px rgba(255, 200, 100, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      margin-bottom: 1.1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
      color: var(--text);
    }

    .tagline {
      margin-top: 0.7rem;
      font-size: clamp(0.7rem, 1.6vw, 0.78rem);
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35em 0.75em;
    }

    .tagline span + span::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.75em;
      opacity: 0.85;
    }

    .divider {
      width: 56px;
      height: 1px;
      margin: 1.5rem 0 1.35rem;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    }

    .icons {
      display: flex;
      gap: 0.75rem;
    }

    .icons a {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      transition: color 0.18s ease, background 0.18s ease,
                  border-color 0.18s ease, transform 0.18s ease;
    }

    .icons a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
    }

    .icons svg { width: 20px; height: 20px; }

    .cta { margin-top: 1.5rem; }

    @media (max-width: 480px) {
      .card { width: min(94vw, 520px); }
      .icons a { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>

  <div class="background" aria-hidden="true"></div>

  <nav class="nav glass" aria-label="Site">
    <a href="/" aria-current="page">Home</a>

  <main class="card glass rise">

    <div class="divider" aria-hidden="true"></div>

      </a>
      <a href="https://www.facebook.com/jeffreyhockema/" target="_blank" rel="noopener" aria-label="Facebook">

    </div>

    <a class="btn btn-accent cta" href="/projects/">
      Projects &amp; demos
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

  </main>

</body>
</html>
